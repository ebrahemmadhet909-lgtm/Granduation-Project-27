<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servix - Login</title>
    <link rel="stylesheet" href="./index.css">
    <!-- FontAwesomeللأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
       <section class="header-section-login">
        <div class="section-login">
            <div class="section-login-imgc">
                <img src="./publilc/imgs/WhatsApp Image 2026-10-30 at 2.20.30 AM.jpeg" alt="">

            </div>

      
    <div class="login-container">
        
        <div class="logo-section">
           <img src="./publilc/imgs/image.png" alt="">
        </div>

        <h3>Welcome back!</h3>
        <p class="subtitle">Sign in Continue and enjoy our services</p>

        
        <form>
            <div class="input-group">
                <input type="text" placeholder="Email Or Phone Number" required>
                <i class="fa-regular fa-envelope"></i>
            </div>

            <div class="input-group">
                <input type="password" placeholder="Password" required>
                <i class="fa-solid fa-lock"></i>
            </div>

            <div class="options-row">
                <label><input type="checkbox" checked> Remember Me</label>
                <a href="#" class="forgot-link">Forgot Password</a>
            </div>

            <button type="submit" class="btn-login">Log In <i class="fa-solid fa-arrow-right"></i></button>
        </form>

        <div class="divider"><span>Or</span></div>

        
        <button class="btn-google">
            <i class="fa-brands fa-google"></i> Sign In With Google
        </button>

        <button class="btn-guest">
            <i class="fa-regular fa-user"></i> Continue as Guest
        </button>

        <p class="signup-text">
            Don't have an account? <a href="#">Create an account</a>
        </p>
    </div>
    </div>
     </section>

</body>
</html>
