<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ServiX | AI Assistant</title>
  <link rel="icon" href="assets/logo.svg">
  <link rel="stylesheet" href="css/tailwind.css">
</head>
<body class="min-h-screen bg-page font-sans leading-normal text-ink" data-layout="client" data-active="assistant" data-title="AI Assistant" data-page="assistant">
  <main class="mx-auto w-full max-w-[1400px] flex-1 p-6 max-[600px]:p-4">
    <section class="flex items-center justify-between gap-6 rounded-[22px] bg-[linear-gradient(120deg,#cfe6ff,#e8f3ff)] px-8 py-7 max-[600px]:px-5 max-[600px]:py-5">
      <div class="min-w-0 flex-1 [&_h1]:mb-2 [&_h1]:text-[clamp(1.5rem,3vw,2.3rem)] [&_h1+p]:max-w-[520px] [&_h1+p]:text-[#35557d]">
        <p class="mb-1.5 text-[.85rem] font-extrabold uppercase tracking-[.06em] text-gold">Smart Assistant</p>
        <h1>How Can I Help You Today?</h1>
        <p>Ask me anything about our services and get instant assistance.</p>
      </div>
      <div class="grid aspect-square w-[clamp(90px,14vw,150px)] shrink-0 place-items-center rounded-full bg-white text-[clamp(2.5rem,6vw,4.5rem)] shadow-card" aria-hidden="true">✨</div>
    </section>

    <div class="grid items-start gap-4 mt-6 grid-cols-[minmax(0,2fr)_minmax(0,1fr)] max-[991px]:grid-cols-[minmax(0,1fr)]">
      <section class="rounded-2xl flex h-[min(560px,70vh)] flex-col overflow-hidden bg-white shadow-card" aria-label="ServiX AI chat">
        <div class="flex items-center gap-2.5 border-b border-line px-4 py-3.5">
          <span class="inline-grid h-[38px] w-[38px] shrink-0 place-items-center rounded-[10px] bg-brand-100 text-[1.1rem]">✨</span>
          <div><strong>ServiX AI</strong><br><small>● Online · Ready to help</small></div>
        </div>
        <div class="flex flex-1 flex-col gap-3 overflow-y-auto p-4" id="chatLog" aria-live="polite">
          <div class="max-w-[min(80%,460px)] rounded-[14px] bg-brand-100 px-3.5 py-2.5 text-[.92rem]">Hello! Welcome to ServiX 👋 I'm your AI assistant. I can help you find services, book appointments, and answer your questions.</div>
        </div>
        <form class="flex gap-2 border-t border-line p-3 [&_input]:rounded-full" id="chatForm">
          <input class="rounded-lg border border-line bg-[#f4f9ff] px-3.5 py-[11px] transition focus:border-brand-500 focus:outline-none focus:ring-[3px] focus:ring-brand-100 [&:user-invalid]:border-bad group-[.toolbar--dark]:border-navy-800 group-[.toolbar--dark]:bg-navy-800 group-[.toolbar--dark]:text-white group-[.toolbar--dark]:placeholder:text-[#b7cdea] w-full" id="chatInput" type="text" placeholder="Type your message here..." aria-label="Message" autocomplete="off">
          <button class="inline-flex items-center justify-center gap-2 text-center font-bold transition hover:brightness-110 active:translate-y-px bg-brand-500 text-white px-[18px] py-2.5 text-[.95rem] rounded-lg" type="submit" aria-label="Send">➤</button>
        </form>
      </section>

      <section class="rounded-2xl bg-white p-5 shadow-card">
        <h2 class="mb-3.5 flex items-center gap-2.5 text-[1.05rem] font-extrabold text-navy-800 before:h-[1.1em] before:w-1 before:rounded-sm before:bg-brand-500 before:content-[''] [&_a]:ml-auto [&_a]:text-[.85rem] [&_a]:font-semibold [&_a]:text-brand-600 group-[.card--dark]:text-white">Quick Suggestions</h2>
        <div class="flex flex-col gap-2.5">
          <button class="flex w-full items-center gap-3 rounded-lg border-0 bg-brand-50 p-3 text-left hover:bg-brand-100 [&_strong]:block [&_strong]:text-[.9rem]" type="button" data-prompt="I need help with car maintenance."><span class="inline-grid h-[38px] w-[38px] shrink-0 place-items-center rounded-[10px] bg-brand-100 text-[1.1rem]">🚗</span><span><strong>Car Services</strong><small>Find car maintenance</small></span></button>
          <button class="flex w-full items-center gap-3 rounded-lg border-0 bg-brand-50 p-3 text-left hover:bg-brand-100 [&_strong]:block [&_strong]:text-[.9rem]" type="button" data-prompt="Show me home repair services."><span class="inline-grid h-[38px] w-[38px] shrink-0 place-items-center rounded-[10px] bg-brand-100 text-[1.1rem]">🏠</span><span><strong>Home Services</strong><small>Explore home repairs</small></span></button>
          <button class="flex w-full items-center gap-3 rounded-lg border-0 bg-brand-50 p-3 text-left hover:bg-brand-100 [&_strong]:block [&_strong]:text-[.9rem]" type="button" data-prompt="I need a doctor at home."><span class="inline-grid h-[38px] w-[38px] shrink-0 place-items-center rounded-[10px] bg-brand-100 text-[1.1rem]">➕</span><span><strong>Medical Services</strong><small>Find medical assistance</small></span></button>
          <button class="flex w-full items-center gap-3 rounded-lg border-0 bg-brand-50 p-3 text-left hover:bg-brand-100 [&_strong]:block [&_strong]:text-[.9rem]" type="button" data-prompt="How can I track my request status?"><span class="inline-grid h-[38px] w-[38px] shrink-0 place-items-center rounded-[10px] bg-brand-100 text-[1.1rem]">📋</span><span><strong>Track My Order</strong><small>Check your request status</small></span></button>
        </div>
      </section>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/render.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages.js"></script>
</body>
</html>
